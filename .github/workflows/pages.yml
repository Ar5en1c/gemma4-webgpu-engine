name: Deploy bench page to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsc --noEmit
      # Pages serves this repo from /<repo>/, so the asset base has to match.
      - run: npx vite build
        env:
          PAGES_BASE: /gemma4-webgpu-engine/
      # An unhashed marker naming the build this deploy published. The page fetches it with
      # cache: no-store, which bypasses the HTTP cache, and compares it against the build id
      # compiled into the bundle. index.html itself is cacheable and its asset names are hashed,
      # so a stale index.html points at a real older bundle and loads without any error at all.
      # That has already sent three rounds of device reports back describing code that was
      # replaced, so the page now says so instead of running.
      - run: echo "{\"build\":\"${GITHUB_SHA}\"}" > dist/build.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
