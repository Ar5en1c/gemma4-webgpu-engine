<!doctype html><meta charset="utf-8"><title>iOS constraint repro</title>
<body style="font:12px ui-monospace,monospace;padding:16px;white-space:pre-wrap"></body>
<script type="module">
// Reproduce the iPhone's device on this Mac by clamping what the adapter advertises, so the
// engine requests the same limits it gets on iOS. Chrome on macOS prints full validation
// messages; Chrome on iOS prints "Validation failure." and nothing else.
const log = (s) => { document.body.textContent += s + '\n'; };

const IOS = { maxBufferSize: 1073741824, maxStorageBufferBindingSize: 1073741824 };
// ?clamp=0 runs the same page against the adapter's real limits, which is the control: the split
// is what changed, and the machine it must not change anything on is the one that never needs it.
const params = new URLSearchParams(location.search);
const clamp = params.get('clamp') !== '0';
// iOS reports no subgroups, so the clamp hides them too and the engine takes the workgroup reduce.
// That makes a clamped run differ from an unclamped one in TWO ways at once, and only one of them
// is the split. ?subgroups=1 keeps the limits clamped and leaves subgroups alone, which is the run
// that isolates the split: same reduce path, same prompt, one buffer against two.
const hideSubgroups = params.get('subgroups') !== '1';
const realRequestAdapter = navigator.gpu.requestAdapter.bind(navigator.gpu);
navigator.gpu.requestAdapter = clamp ? async (opts) => {
  const a = await realRequestAdapter(opts);
  if (!a) return a;
  const limits = new Proxy(a.limits, {
    get(t, p) {
      if (typeof p === 'string' && p in IOS) return Math.min(Number(t[p]), IOS[p]);
      const v = t[p];
      return typeof v === 'function' ? v.bind(t) : v;
    },
  });
  const features = { has: (f) => (f === 'subgroups' ? false : a.features.has(f)) };
  return new Proxy(a, {
    get(t, p) {
      if (p === 'limits') return limits;
      if (p === 'features' && hideSubgroups) return features;
      const v = t[p];
      return typeof v === 'function' ? v.bind(t) : v;
    },
  });
} : realRequestAdapter;
log(clamp
  ? 'adapter clamped to: ' + JSON.stringify(IOS)
  : 'adapter NOT clamped: this device\'s real limits, subgroups as reported');
if (clamp) log('subgroups: ' + (hideSubgroups ? 'hidden, as on iOS' : 'left as this adapter reports'));

// Correctness runs want the cache, because re-downloading two gigabytes to answer a question about
// buffer routing proves nothing extra. The default stays uncached, which is what a device report
// should be. Add ?cache=1 to keep the weights.
const useCache = new URLSearchParams(location.search).get('cache') === '1';
log('weight cache: ' + (useCache ? 'on' : 'off'));

// Every console warning, on the page, because the split plan announces itself through one and a
// silent split and an absent split look identical from the output alone.
const realWarn = console.warn.bind(console);
console.warn = (...a) => { log('warn: ' + a.join(' ')); realWarn(...a); };

const { Gemma4Mobile } = await import('../src/index.ts');
log('loading...');
let engine;
try {
  engine = await Gemma4Mobile.load(null, {
    cache: useCache,
    onProgress: (p) => { if (p.fraction) document.title = (p.fraction * 100).toFixed(0) + '%'; },
  });
} catch (e) { log('LOAD THREW: ' + e); throw e; }
log('loaded');
log('device errors after load: ' + JSON.stringify(engine.deviceErrors(), null, 1));

let text = '';
try {
  for await (const c of engine.generate([{ role: 'user', content: 'In one sentence, what is photosynthesis?' }], { maxNewTokens: 20 })) text = c.text;
} catch (e) { log('GENERATE THREW: ' + e); }
log('\n--- OUTPUT ---\n' + JSON.stringify(text));
// After the generate, not after the load: reducePolicy reads the pipeline store's variant and the
// store is not built until the first forward, so reading it earlier always answers null and says
// nothing about which reduction actually ran.
log('reduce path: ' + engine.reducePolicy());
// What the engine is actually holding. Xenova's engine runs this model on an iPhone, so the device
// is not the constraint and this number is the thing to compare.
{
  const r = engine.bufferStats();
  const MiB = 1024 * 1024;
  log('residency: ' + (r
    ? `${(r.weightBytes / MiB).toFixed(0)} MiB of weights in ${r.weightBuffers} buffers, `
      + `${(r.activationBytes / MiB).toFixed(0)} MiB of activations in ${r.activationBuffers} buffers, `
      + `${((r.weightBytes + r.activationBytes) / MiB).toFixed(0)} MiB total`
    : 'unavailable'));
}
log('\n--- device errors after generate ---\n' + JSON.stringify(engine.deviceErrors(), null, 1));
log('\nDONE');
</script>
